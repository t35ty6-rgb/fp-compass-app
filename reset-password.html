<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>パスワード再設定 — FP Compass</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<meta name="theme-color" content="#0E1116">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1116; --ink-2:#353D4F; --ink-3:#6B7385;
    --paper:#FAFAF7; --paper-2:#F0EFEA; --paper-warm:#FFFFFF;
    --signal:#E63946; --signal-soft:#FFE5E8;
    --money:#10B981; --money-soft:#D1FAE5;
    --line:rgba(14,17,22,0.10);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100vh;}
  body{
    font-family:'Manrope','Noto Sans JP',sans-serif;
    background:linear-gradient(135deg,#0F172A 0%,#1B2658 60%,#3838CC 100%);
    color:#fff;line-height:1.75;font-feature-settings:"palt";
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .card{
    max-width:440px;width:100%;
    background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:16px;padding:42px 38px;
    box-shadow:0 24px 64px rgba(0,0,0,0.4);
  }
  .brand{
    font-family:'Manrope',sans-serif;font-size:11px;letter-spacing:0.32em;
    text-transform:uppercase;opacity:0.85;margin-bottom:14px;font-weight:700;
  }
  h1{
    font-family:'Manrope',sans-serif;font-size:22px;font-weight:800;
    letter-spacing:-0.01em;margin:0 0 6px;line-height:1.35;
  }
  .sub{font-size:13px;opacity:0.85;margin-bottom:22px;line-height:1.7;}
  label{
    display:block;font-size:11.5px;font-weight:700;margin:14px 0 6px;
    letter-spacing:0.04em;opacity:0.85;
  }
  input{
    width:100%;background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.22);
    border-radius:8px;padding:11px 14px;
    color:#fff;font-family:inherit;font-size:14px;
    outline:none;transition:border-color .15s;
  }
  input::placeholder{color:rgba(255,255,255,0.45);}
  input:focus{border-color:#FFE9A8;}
  button{
    width:100%;background:#FFE9A8;color:#0F172A;
    border:none;border-radius:8px;padding:14px;margin-top:18px;
    font-size:14px;font-weight:800;letter-spacing:0.08em;
    cursor:pointer;font-family:'Manrope',sans-serif;
    text-transform:uppercase;transition:all 0.15s;
  }
  button:hover:not(:disabled){background:#fff;transform:translateY(-1px);}
  button:disabled{opacity:0.55;cursor:not-allowed;}
  .msg{margin-top:14px;font-size:12.5px;min-height:18px;text-align:center;line-height:1.6;}
  .msg.ok{color:#86EFAC;}
  .msg.err{color:#FFB5B5;}
  .help{
    margin-top:24px;padding-top:18px;
    border-top:1px solid rgba(255,255,255,0.12);
    font-size:11.5px;opacity:0.7;line-height:1.7;text-align:center;
  }
  .help a{color:#FFE9A8;text-decoration:none;}
  .pw-rule{
    font-size:11px;opacity:0.65;margin-top:4px;
    font-family:'JetBrains Mono',monospace;letter-spacing:0.04em;
  }
</style>
</head>
<body>
<div class="card">
  <div class="brand">FP COMPASS · SKELETON INC.</div>
  <h1 id="r-title">パスワードを再設定</h1>
  <p class="sub" id="r-sub">新しいパスワードを入力してください (8 文字以上)</p>

  <div id="r-form">
    <label for="r-email">メールアドレス</label>
    <input id="r-email" type="email" disabled placeholder="読み込み中…">

    <label for="r-pw">新しいパスワード</label>
    <input id="r-pw" type="password" placeholder="8 文字以上" autocomplete="new-password">
    <div class="pw-rule">8 文字以上 / 英数字混合推奨</div>

    <label for="r-pw2">確認のため もう一度</label>
    <input id="r-pw2" type="password" placeholder="もう一度入力" autocomplete="new-password">

    <button id="r-btn">パスワードを設定</button>
    <div id="r-msg" class="msg"></div>
  </div>

  <div class="help">サポート → <a href="mailto:support@skeleton-inc.jp">support@skeleton-inc.jp</a></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

  const __isStaging = /staging|skeleton-fp-compass-staging/.test(location.hostname);
  const firebaseConfig = __isStaging ? {
    apiKey: "AIzaSyAV9SEZZ5Tqu8pHUmmjMZ3RhrN_jFgMevs",
    authDomain: "skeleton-fp-compass-staging.firebaseapp.com",
    projectId: "skeleton-fp-compass-staging",
  } : {
    apiKey: "AIzaSyAmVAEe9l9e1Yo_dzzJdbTVU35wWKd2sH4",
    authDomain: "skeleton-fp-compass-632026.firebaseapp.com",
    projectId: "skeleton-fp-compass-632026",
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const $ = (id) => document.getElementById(id);
  const msg = (kind, text) => { const m = $("r-msg"); m.className = "msg " + (kind || ""); m.textContent = text; };

  const params = new URLSearchParams(location.search);
  const oobCode = params.get("oobCode");
  const mode = params.get("mode") || "resetPassword";

  if (!oobCode) {
    $("r-title").textContent = "無効なリンク";
    $("r-sub").textContent = "リンクが正しくないか、 すでに使用されています。 再度パスワード再設定を リクエストしてください。";
    $("r-form").style.display = "none";
  } else if (mode !== "resetPassword") {
    $("r-title").textContent = "対応していない操作";
    $("r-sub").textContent = "このページはパスワード再設定専用です。";
    $("r-form").style.display = "none";
  } else {
    // oobCode を検証 → 紐づく email を表示
    try {
      const email = await verifyPasswordResetCode(auth, oobCode);
      $("r-email").value = email;
    } catch (e) {
      $("r-title").textContent = "リンクが失効しています";
      $("r-sub").textContent = "再設定リンクは 1 時間で失効します。 再度パスワード再設定を リクエストしてください。";
      $("r-form").style.display = "none";
    }
  }

  $("r-btn").addEventListener("click", async () => {
    const pw = $("r-pw").value;
    const pw2 = $("r-pw2").value;
    if (pw.length < 8) { msg("err", "パスワードは 8 文字以上で入力してください"); return; }
    if (pw !== pw2) { msg("err", "パスワードが一致しません"); return; }
    $("r-btn").disabled = true; $("r-btn").textContent = "設定中…";
    msg("", "");
    try {
      await confirmPasswordReset(auth, oobCode, pw);
      msg("ok", "✓ パスワードを設定しました。 ログイン画面に戻ります…");
      setTimeout(() => { location.href = "/"; }, 2200);
    } catch (e) {
      const map = {
        "auth/expired-action-code": "リンクが失効しています。 もう一度パスワード再設定をリクエストしてください",
        "auth/invalid-action-code": "リンクが無効です。 もう一度パスワード再設定をリクエストしてください",
        "auth/weak-password": "パスワードが弱すぎます (8 文字以上 + 英数字混合推奨)",
      };
      msg("err", map[e.code] || (e.message || e.code));
      $("r-btn").disabled = false; $("r-btn").textContent = "パスワードを設定";
    }
  });

  $("r-pw2").addEventListener("keydown", e => { if (e.key === "Enter") $("r-btn").click(); });
</script>
</body>
</html>
