<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FP Compass · TODO (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* 既存 FP Compass palette (実測 済 · そのまま 維持) */
    --indigo: #5B5BF0;
    --indigo-soft: #EEF0FF;
    --indigo-hover: #4747D8;
    --ink: #0F172A;
    --ink-2: #1E293B;
    --slate-500: #64748B;
    --slate-400: #94A3B8;
    --slate-300: #CBD5E1;
    --slate-200: #E2E8F0;
    --slate-100: #F1F5F9;
    --slate-50:  #F8FAFC;
    --white: #FFFFFF;
    --emerald: #059669;
    --emerald-soft: #D1FAE5;
    --red: #DC2626;
    --red-soft: #FEE2E2;
    --amber-soft: #FEF3C7;
    --amber: #D97706;
  }
  * { box-sizing: border-box; }
  html, body {
    background: var(--slate-50);
    color: var(--ink);
    font-family: 'Noto Sans JP', -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }
  .frame {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 32px 120px;
  }
  /* ── card container (既存 FP Compass の dashboard card 準拠) ── */
  .card {
    background: var(--white);
    border: 1px solid var(--slate-200);
    border-radius: 12px;
    padding: 24px 26px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.03);
  }
  /* ── card head ── */
  .card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 16px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--slate-200);
  }
  .card-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    margin: 0;
    letter-spacing: 0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    background: var(--indigo-soft);
    color: var(--indigo);
    border-radius: 6px;
    font-size: 14px;
  }
  .card-count {
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--slate-500);
    letter-spacing: 0.02em;
  }
  .card-count b {
    color: var(--indigo);
    font-weight: 800;
    font-size: 14px;
    margin-right: 2px;
  }
  /* ── group (section) ── */
  .group {
    padding: 14px 0 4px;
  }
  .group + .group {
    border-top: 1px dashed var(--slate-200);
    margin-top: 4px;
    padding-top: 18px;
  }
  .group-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    user-select: none;
  }
  .group-arrow {
    display: inline-block;
    width: 10px;
    height: 10px;
    color: var(--slate-400);
    font-size: 10px;
    transition: transform 180ms ease;
  }
  .group.is-open .group-arrow { transform: rotate(90deg); }
  .group-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px 3px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  .group-pill.is-urgent  { background: var(--red-soft);   color: var(--red); }
  .group-pill.is-warn    { background: var(--amber-soft); color: var(--amber); }
  .group-pill.is-neutral { background: var(--slate-100);  color: var(--slate-500); }
  .group-pill-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .group-count {
    font-family: 'Manrope', sans-serif;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--slate-500);
    letter-spacing: 0.02em;
  }
  .group-desc {
    font-size: 11.5px;
    color: var(--slate-400);
    letter-spacing: 0.01em;
    margin-left: 4px;
  }
  .group-body { display: none; }
  .group.is-open .group-body { display: block; }
  /* ── task row ── */
  .task-row {
    display: grid;
    grid-template-columns: 22px 1fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 12px 4px 12px 2px;
    border-bottom: 1px solid var(--slate-100);
    transition: background 180ms ease, opacity 400ms ease;
    position: relative;
  }
  .task-row:last-child { border-bottom: 0; }
  .task-row:hover { background: var(--slate-50); }
  .task-row:hover .task-action { opacity: 1; transform: translateX(0); }
  .task-row.is-done { opacity: 0.42; }
  /* circle checkbox (Things 3 準拠 · palette は 既存 indigo) */
  .task-check {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--slate-300);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 180ms ease, background 180ms ease;
    flex-shrink: 0;
  }
  .task-check:hover { border-color: var(--indigo); }
  .task-check::after {
    content: '';
    width: 10px;
    height: 8px;
    background:
      linear-gradient(to bottom right, transparent 47%, var(--white) 47%, var(--white) 53%, transparent 53%),
      linear-gradient(to bottom left,  transparent 47%, var(--white) 47%, var(--white) 53%, transparent 53%);
    background-size: 60% 100%, 60% 100%;
    background-position: 100% 0, 0 0;
    background-repeat: no-repeat;
    opacity: 0;
    transform: scale(0.4);
    transition: opacity 220ms ease, transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .task-check.is-checked {
    border-color: var(--indigo);
    background: var(--indigo);
  }
  .task-check.is-checked::after {
    opacity: 1;
    transform: scale(1);
  }
  /* task body */
  .task-body { min-width: 0; }
  .task-title {
    font-size: 13.5px;
    color: var(--ink);
    margin: 0 0 2px;
    font-weight: 600;
    letter-spacing: 0.005em;
  }
  .task-title .who {
    color: var(--ink);
    font-weight: 700;
  }
  .task-title .who::after {
    content: '様 ·';
    color: var(--slate-400);
    font-weight: 500;
    margin: 0 6px 0 2px;
    font-size: 11.5px;
    letter-spacing: 0.04em;
  }
  .task-sub {
    font-size: 11.5px;
    color: var(--slate-500);
    margin: 0;
    letter-spacing: 0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* deadline */
  .task-deadline {
    font-family: 'Manrope', 'JetBrains Mono', sans-serif;
    font-size: 11.5px;
    color: var(--slate-500);
    font-weight: 600;
    letter-spacing: 0.02em;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .task-deadline .icon {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.5;
  }
  .task-row[data-tone="urgent"] .task-deadline { color: var(--red); }
  .task-row[data-tone="urgent"] .task-deadline .icon { opacity: 1; }
  .task-row[data-tone="warn"] .task-deadline { color: var(--amber); }
  /* action button */
  .task-action {
    background: var(--white);
    color: var(--ink);
    border: 1px solid var(--slate-300);
    padding: 5px 11px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
    opacity: 0;
    transform: translateX(3px);
    transition: opacity 180ms ease, transform 180ms ease, background 150ms, border-color 150ms, color 150ms;
    white-space: nowrap;
  }
  .task-action:hover {
    background: var(--indigo);
    color: var(--white);
    border-color: var(--indigo);
  }
  .task-action.is-primary {
    background: var(--indigo);
    color: var(--white);
    border-color: var(--indigo);
    opacity: 1;
    transform: translateX(0);
  }
  .task-action.is-primary:hover { background: var(--indigo-hover); border-color: var(--indigo-hover); }
  /* empty state */
  .empty-state {
    text-align: center;
    padding: 56px 20px 40px;
  }
  .empty-emoji {
    font-size: 44px;
    margin-bottom: 12px;
    line-height: 1;
  }
  .empty-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--ink);
    margin: 0 0 6px;
    letter-spacing: 0.005em;
  }
  .empty-sub {
    font-size: 12.5px;
    color: var(--slate-500);
    margin: 0 0 20px;
    letter-spacing: 0.01em;
  }
  .empty-cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--indigo);
    color: var(--white);
    border: none;
    padding: 9px 18px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: 0.02em;
    cursor: pointer;
  }
  .empty-cta + .empty-cta {
    background: var(--white);
    color: var(--ink);
    border: 1px solid var(--slate-300);
    margin-left: 8px;
  }
  /* done pile */
  .done-pile {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed var(--slate-200);
  }
  /* proto toolbar */
  .proto-bar {
    position: fixed;
    top: 12px;
    right: 12px;
    background: var(--ink);
    color: var(--white);
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    z-index: 100;
    display: flex;
    gap: 8px;
    align-items: center;
    font-family: 'Manrope', sans-serif;
    font-weight: 600;
  }
  .proto-bar-btn {
    background: transparent;
    color: var(--slate-300);
    border: 1px solid var(--slate-500);
    padding: 3px 8px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 150ms, color 150ms;
  }
  .proto-bar-btn:hover { background: var(--white); color: var(--ink); border-color: var(--white); }
  /* responsive */
  @media (max-width: 640px) {
    .frame { padding: 28px 16px 100px; }
    .card { padding: 18px 16px; border-radius: 10px; }
    .task-row { grid-template-columns: 20px 1fr auto; gap: 10px; padding: 11px 2px; }
    .task-row .task-action { display: none; }
    .task-title { font-size: 13px; }
    .task-sub { font-size: 11px; }
    .group-desc { display: none; }
  }
</style>
</head>
<body>

<div class="proto-bar">
  <span>PROTOTYPE · TODO 洗練</span>
  <button class="proto-bar-btn" id="btn-empty">空 の 状態</button>
  <button class="proto-bar-btn" id="btn-full">サンプル</button>
</div>

<div class="frame" id="frame"></div>

<script>
  const DATA = {
    countActive: 7,
    countTotal: 41,
    groups: [
      {
        tone: 'urgent',
        title: '今日 中 に 対応',
        desc: '期限 到来 / 提案 停滞 / 面談 直前',
        open: true,
        items: [
          { who: '吉田 恭聡', task: 'LINE 質問 に 返信', sub: '「NISA と iDeCo どちら 優先?」 · 未 応答 6h', deadline: '今日中', action: '💬 返信 する', primary: true },
          { who: '田中 花子', task: 'Zoom URL 発行', sub: '候補日 選択 済 · 面談 18:00 開始', deadline: '15:00 前', action: '🎥 Zoom URL 発行', primary: true },
        ],
      },
      {
        tone: 'warn',
        title: '今週 中 に 対応',
        desc: '提案 期限 迫る / 面談 近い',
        open: true,
        items: [
          { who: '佐藤 一郎', task: '候補日 3 を 送付', sub: '初回 面談 · アンケート 回答 済', deadline: '木 まで', action: '📅 候補日 再送' },
          { who: '鈴木 誠',   task: 'iDeCo 提案 書 完成', sub: '前回 議事録 · 掛金 32,000 円 前提', deadline: '金 まで', action: '📋 カルテ' },
          { who: '山田 太郎', task: '面談 議事録 の 追加 質問', sub: '客 から 「配偶者 の 保険 も」', deadline: '木 まで', action: '💬 返信 する' },
        ],
      },
      {
        tone: 'neutral',
        title: '今月 の 予定',
        desc: '長期 未 接触 の 再 engagement 等',
        open: false,
        items: [
          { who: '高橋 恵子', task: '追加 提案 検討', sub: '前回 面談 から 45 日 · 学資 追加 の 可能性', deadline: '今月 中', action: '📋 カルテ' },
          { who: '中村 誠',   task: '更新 前 の 確認', sub: '保険 満期 6 週 前 · 見直し の 種', deadline: '今月 末', action: '📋 カルテ' },
        ],
      },
    ],
    done: [
      { who: '安井 康介', task: '議事録 送付 済', sub: '本日 09:22 送信', deadline: '完了' },
      { who: '池田 弥生', task: '提案 書 送付 済', sub: '本日 11:04 送信', deadline: '完了' },
    ],
  };

  const renderRow = (t, tone = 'neutral', done = false) => `
    <div class="task-row ${done ? 'is-done' : ''}" data-tone="${tone}">
      <div class="task-check ${done ? 'is-checked' : ''}" data-check></div>
      <div class="task-body">
        <div class="task-title"><span class="who">${t.who}</span>${t.task}</div>
        <div class="task-sub">${t.sub}</div>
      </div>
      <div class="task-deadline"><span class="icon"></span>${t.deadline}</div>
      ${t.action ? `<button class="task-action ${t.primary ? 'is-primary' : ''}">${t.action}</button>` : '<span></span>'}
    </div>
  `;

  const renderGroup = (g) => `
    <div class="group ${g.open ? 'is-open' : ''}">
      <div class="group-head" data-group-toggle>
        <span class="group-arrow">▶</span>
        <span class="group-pill is-${g.tone}"><span class="group-pill-dot"></span>${g.title}</span>
        <span class="group-count">${g.items.length} 件</span>
        <span class="group-desc">· ${g.desc}</span>
      </div>
      <div class="group-body">
        ${g.items.map(t => renderRow(t, g.tone)).join('')}
      </div>
    </div>
  `;

  const renderFull = () => `
    <div class="card">
      <div class="card-head">
        <h2 class="card-title"><span class="card-title-icon">📝</span>今日 の TODO</h2>
        <div class="card-count"><b>${DATA.countActive}</b>件 未 対応</div>
      </div>
      ${DATA.groups.map(renderGroup).join('')}
      <div class="done-pile">
        <div class="group" id="done-group">
          <div class="group-head" data-group-toggle>
            <span class="group-arrow">▶</span>
            <span class="group-pill" style="background:#DCFCE7;color:#166534;"><span class="group-pill-dot"></span>完了 済 (今日)</span>
            <span class="group-count">${DATA.done.length} 件</span>
          </div>
          <div class="group-body">
            ${DATA.done.map(t => renderRow(t, 'neutral', true)).join('')}
          </div>
        </div>
      </div>
    </div>
  `;

  const renderEmpty = () => `
    <div class="card">
      <div class="card-head">
        <h2 class="card-title"><span class="card-title-icon">📝</span>今日 の TODO</h2>
        <div class="card-count"><b>0</b>件 未 対応</div>
      </div>
      <div class="empty-state">
        <div class="empty-emoji">✨</div>
        <p class="empty-title">今日 は 急ぎ 対応 すべき方 は いません</p>
        <p class="empty-sub">全 ${DATA.countTotal} 名 と 直近 21 日 以内 に 接触 済 · 次 の 打ち手 を どうぞ</p>
        <button class="empty-cta">🔔 ご無沙汰 フォロー</button>
        <button class="empty-cta">👥 顧客 台帳</button>
      </div>
    </div>
  `;

  const frame = document.getElementById('frame');
  const setState = (mode) => {
    frame.innerHTML = mode === 'empty' ? renderEmpty() : renderFull();
    frame.querySelectorAll('[data-check]').forEach(el => {
      el.addEventListener('click', () => {
        const row = el.closest('.task-row');
        const now = el.classList.toggle('is-checked');
        if (now) setTimeout(() => row.classList.add('is-done'), 220);
        else row.classList.remove('is-done');
      });
    });
    frame.querySelectorAll('[data-group-toggle]').forEach(head => {
      head.addEventListener('click', () => head.closest('.group').classList.toggle('is-open'));
    });
  };
  document.getElementById('btn-empty').addEventListener('click', () => setState('empty'));
  document.getElementById('btn-full').addEventListener('click', () => setState('full'));
  setState('full');
</script>
</body>
</html>
