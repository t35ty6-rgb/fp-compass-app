<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FP Compass · TODO Kanban (Trello 風)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* 既存 FP Compass palette (Indigo #5B5BF0 系) 維持 · Trello の 構造 のみ 抜粋 */
    --indigo: #5B5BF0;
    --indigo-hover: #4747D8;
    --indigo-soft: #EEF0FF;
    --ink: #0F172A;
    --slate-500: #64748B;
    --slate-400: #94A3B8;
    --slate-300: #CBD5E1;
    --slate-200: #E2E8F0;
    --slate-100: #F1F5F9;
    --slate-50: #F8FAFC;
    --white: #FFFFFF;
    --red: #DC2626;
    --red-soft: #FEE2E2;
    --amber: #D97706;
    --amber-soft: #FEF3C7;
    --emerald: #059669;
    --emerald-soft: #D1FAE5;
    /* board 背景 = ごく 薄 い indigo gradient (Trello の 青 背景 を 弱く · 既存 トーン と 共存) */
    --board-bg: linear-gradient(135deg, #EEF0FF 0%, #F8FAFC 100%);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--board-bg);
    color: var(--ink);
    font-family: 'Noto Sans JP', -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ── proto bar ── */
  .proto-bar {
    position: fixed; top: 12px; right: 12px;
    background: var(--ink); color: var(--white);
    padding: 7px 12px; border-radius: 6px;
    font-family: 'Manrope', sans-serif;
    font-size: 10.5px; letter-spacing: 0.08em;
    z-index: 200; font-weight: 600;
  }

  /* ── page head ── */
  .head {
    max-width: 100%;
    padding: 20px 32px 12px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .head-title {
    font-size: 18px; font-weight: 800; color: var(--ink);
    margin: 0;
    display: flex; align-items: center; gap: 10px;
  }
  .head-title .icon {
    width: 28px; height: 28px;
    background: var(--indigo); color: var(--white);
    border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .head-meta {
    font-family: 'Manrope', sans-serif;
    font-size: 12px; color: var(--slate-500); font-weight: 700;
  }
  .head-meta b { color: var(--indigo); font-size: 14px; font-weight: 800; margin-right: 3px; }

  /* ── quick add bar ── */
  .quick-add {
    max-width: calc(100% - 64px);
    margin: 0 32px 16px;
    background: var(--white);
    border: 1px solid var(--slate-200);
    border-radius: 10px;
    padding: 10px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .quick-add-plus {
    width: 22px; height: 22px; border: 1.5px dashed var(--slate-300);
    color: var(--slate-400); border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .quick-add:hover .quick-add-plus { border-color: var(--indigo); color: var(--indigo); }
  .quick-add-input {
    flex: 1; border: 0; background: transparent;
    font-family: inherit; font-size: 13px; color: var(--ink); outline: none;
  }
  .quick-add-input::placeholder { color: var(--slate-400); }
  .quick-add-hint {
    font-family: 'Manrope', sans-serif;
    font-size: 10.5px; color: var(--slate-400);
    display: flex; gap: 4px;
  }
  .quick-add-hint code {
    background: var(--slate-100); border: 1px solid var(--slate-200); border-radius: 4px;
    padding: 1px 6px; font-size: 10.5px; color: var(--slate-500); font-family: inherit;
  }

  /* ── kanban board ── */
  .board {
    display: flex;
    gap: 14px;
    padding: 0 32px 40px;
    overflow-x: auto;
    align-items: flex-start;
    min-height: calc(100vh - 130px);
  }
  .col {
    flex: 0 0 300px;
    max-height: calc(100vh - 160px);
    background: rgba(241, 245, 249, 0.72);
    backdrop-filter: blur(4px);
    border: 1px solid var(--slate-200);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .col-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px;
    background: transparent;
    border-bottom: 1px solid rgba(203, 213, 225, 0.4);
  }
  .col-head-title {
    font-size: 12.5px; font-weight: 800; color: var(--ink);
    letter-spacing: 0.02em;
  }
  .col-head-count {
    font-family: 'Manrope', sans-serif;
    font-size: 11px; font-weight: 700;
    color: var(--slate-500); background: var(--slate-100);
    padding: 2px 8px; border-radius: 999px;
  }
  .col.is-alarm .col-head-title { color: var(--red); }
  .col.is-alarm .col-head-count { background: var(--red-soft); color: var(--red); }
  .col.is-warn .col-head-title { color: var(--amber); }
  .col.is-warn .col-head-count { background: var(--amber-soft); color: var(--amber); }
  .col.is-done .col-head-title { color: var(--emerald); }
  .col.is-done .col-head-count { background: var(--emerald-soft); color: var(--emerald); }
  .col-head-more {
    margin-left: auto;
    color: var(--slate-400); font-size: 16px;
    background: transparent; border: 0; cursor: pointer;
    padding: 0 4px;
  }
  .col-body {
    flex: 1;
    overflow-y: auto;
    padding: 8px 8px 4px;
    display: flex; flex-direction: column; gap: 8px;
    min-height: 50px;
  }
  .col-body.is-drop-target { background: rgba(91, 91, 240, 0.06); }

  /* ── card ── */
  .card {
    background: var(--white);
    border: 1px solid var(--slate-200);
    border-radius: 8px;
    padding: 10px 12px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    cursor: grab;
    transition: transform 120ms, box-shadow 120ms, opacity 200ms;
    position: relative;
  }
  .card:hover { box-shadow: 0 2px 6px rgba(15, 23, 42, 0.09); transform: translateY(-1px); }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.4; }
  .card.done { opacity: 0.5; background: var(--slate-50); }
  /* left color stripe for priority */
  .card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; border-top-left-radius: 8px; border-bottom-left-radius: 8px;
    background: var(--slate-300);
  }
  .card[data-p="p1"]::before { background: var(--red); }
  .card[data-p="p2"]::before { background: var(--amber); }
  .card[data-p="p3"]::before { background: var(--slate-400); }
  /* label chips (Trello 型) */
  .card-labels {
    display: flex; gap: 4px; margin-bottom: 6px;
  }
  .card-label {
    height: 6px; width: 28px; border-radius: 3px;
    background: var(--slate-300);
  }
  .card-label.p1 { background: var(--red); }
  .card-label.p2 { background: var(--amber); }
  .card-label.line { background: #06C755; }
  .card-label.zoom { background: #2D8CFF; }
  .card-label.proposal { background: #A855F7; }
  /* title */
  .card-title {
    font-size: 13px; font-weight: 600; color: var(--ink);
    line-height: 1.4; margin: 0 0 6px;
    letter-spacing: 0.005em;
  }
  /* meta row */
  .card-meta {
    display: flex; align-items: center; gap: 8px;
    margin-top: 8px;
  }
  .card-avatar {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--indigo-soft); color: var(--indigo);
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'Manrope', sans-serif;
    font-size: 10.5px; font-weight: 800;
    flex-shrink: 0;
  }
  .card-who {
    font-size: 11.5px; color: var(--slate-500); font-weight: 600;
  }
  .card-due {
    margin-left: auto;
    font-family: 'Manrope', sans-serif;
    font-size: 11px; color: var(--slate-500); font-weight: 700;
    letter-spacing: 0.02em;
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 7px; border-radius: 4px;
    background: var(--slate-100);
  }
  .card-due .icon { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.6; }
  .card[data-p="p1"] .card-due { color: var(--red); background: var(--red-soft); }
  .card[data-p="p2"] .card-due { color: var(--amber); background: var(--amber-soft); }
  /* checkbox for done (subtle) */
  .card-check-btn {
    background: var(--white); border: 1.5px solid var(--slate-300);
    color: var(--slate-500);
    width: 20px; height: 20px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
    transition: all 150ms;
    flex-shrink: 0;
  }
  .card-check-btn:hover { border-color: var(--emerald); color: var(--emerald); }
  .card-check-btn svg { width: 10px; height: 10px; opacity: 0; }
  .card-check-btn.on { background: var(--emerald); border-color: var(--emerald); color: var(--white); }
  .card-check-btn.on svg { opacity: 1; }
  /* add card at bottom */
  .col-add {
    margin: 2px 8px 8px;
    background: transparent; border: 0;
    color: var(--slate-500); font-family: inherit;
    font-size: 12px; font-weight: 600;
    text-align: left;
    padding: 8px 10px; border-radius: 6px;
    cursor: pointer;
    transition: background 150ms, color 150ms;
  }
  .col-add:hover { background: rgba(91, 91, 240, 0.08); color: var(--indigo); }

  /* ── responsive ── */
  @media (max-width: 640px) {
    .head { padding: 16px 14px 10px; }
    .quick-add { margin: 0 14px 12px; max-width: calc(100% - 28px); padding: 8px 12px; }
    .quick-add-hint { display: none; }
    .board { padding: 0 14px 40px; gap: 10px; }
    .col { flex: 0 0 260px; max-height: none; }
  }
</style>
</head>
<body>

<div class="proto-bar">PROTOTYPE · Trello 風 Kanban</div>

<header class="head">
  <h1 class="head-title"><span class="icon">📋</span>今日 の TODO</h1>
  <div class="head-meta"><b>7</b>件 未 対応 · 2 件 完了 済</div>
</header>

<div class="quick-add">
  <span class="quick-add-plus">+</span>
  <input class="quick-add-input" type="text" placeholder="task を 追加 · 例 「@吉田 · 提案 書 続き · 金 · P2」" id="qadd">
  <span class="quick-add-hint"><code>@客</code><code>期限</code><code>P1</code></span>
</div>

<div class="board" id="board"></div>

<script>
  const CHECK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

  // 4 columns · 各 column に card 積む
  const STATE = {
    cols: [
      { id: 'today',  title: '今日 中', tone: 'alarm', cards: [
        { id: 'c1', p: 'p1', who: '吉田 恭聡', title: 'LINE 質問 に 返信 「NISA と iDeCo どちら 優先?」', due: '今日中', labels: ['p1','line'] },
        { id: 'c2', p: 'p1', who: '田中 花子', title: 'Zoom URL 発行 · 面談 18:00', due: '15:00', labels: ['p1','zoom'] },
      ]},
      { id: 'week', title: '今週 中', tone: 'warn', cards: [
        { id: 'c3', p: 'p2', who: '佐藤 一郎', title: '候補日 3 送付', due: '木', labels: ['p2','zoom'] },
        { id: 'c4', p: 'p2', who: '鈴木 誠', title: 'iDeCo 提案 書 完成 (掛金 32,000 円)', due: '金', labels: ['p2','proposal'] },
        { id: 'c5', p: 'p3', who: '山田 太郎', title: '面談 後 追加 質問 に 返信', due: '木', labels: ['line'] },
      ]},
      { id: 'month', title: '今月', tone: 'neutral', cards: [
        { id: 'c6', p: 'p3', who: '高橋 恵子', title: '追加 提案 検討 (学資 保険 の 可能性)', due: '今月 中', labels: ['proposal'] },
        { id: 'c7', p: 'p3', who: '中村 誠', title: '更新 前 の 確認 (満期 6 週 前)', due: '今月 末', labels: [] },
      ]},
      { id: 'done', title: '完了', tone: 'done', cards: [
        { id: 'c8', done: true, p: '', who: '安井 康介', title: '議事録 送付 済', due: '09:22', labels: [] },
        { id: 'c9', done: true, p: '', who: '池田 弥生', title: '提案 書 送付 済', due: '11:04', labels: [] },
      ]},
    ],
  };

  const initial = (n) => n.replace(/\s+/g, '').charAt(0) || '?';

  const cardHtml = (c) => `
    <div class="card ${c.done ? 'done' : ''}" data-p="${c.p || ''}" data-card-id="${c.id}" draggable="true">
      ${c.labels && c.labels.length ? `<div class="card-labels">${c.labels.map(l => `<span class="card-label ${l}"></span>`).join('')}</div>` : ''}
      <p class="card-title">${c.title}</p>
      <div class="card-meta">
        <button class="card-check-btn ${c.done ? 'on' : ''}" data-check title="完了 に する">${CHECK_SVG}</button>
        <span class="card-avatar">${initial(c.who)}</span>
        <span class="card-who">${c.who} 様</span>
        <span class="card-due"><span class="icon"></span>${c.due}</span>
      </div>
    </div>`;

  const colHtml = (col) => `
    <section class="col is-${col.tone}" data-col-id="${col.id}">
      <div class="col-head">
        <span class="col-head-title">${col.title}</span>
        <span class="col-head-count">${col.cards.length}</span>
        <button class="col-head-more" title="列 メニュー">⋯</button>
      </div>
      <div class="col-body" data-drop>
        ${col.cards.map(cardHtml).join('')}
      </div>
      <button class="col-add" data-add-col="${col.id}">+ カード を 追加</button>
    </section>`;

  const board = document.getElementById('board');
  const render = () => {
    board.innerHTML = STATE.cols.map(colHtml).join('');
    wireDrag();
    wireInteractions();
  };

  function findCard(id) {
    for (const col of STATE.cols) {
      const idx = col.cards.findIndex(c => c.id === id);
      if (idx !== -1) return { col, idx, card: col.cards[idx] };
    }
    return null;
  }

  function wireDrag() {
    document.querySelectorAll('.card').forEach(el => {
      el.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', el.dataset.cardId);
        e.dataTransfer.effectAllowed = 'move';
        setTimeout(() => el.classList.add('dragging'), 0);
      });
      el.addEventListener('dragend', () => el.classList.remove('dragging'));
    });
    document.querySelectorAll('[data-drop]').forEach(body => {
      body.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        body.classList.add('is-drop-target');
      });
      body.addEventListener('dragleave', () => body.classList.remove('is-drop-target'));
      body.addEventListener('drop', (e) => {
        e.preventDefault();
        body.classList.remove('is-drop-target');
        const cardId = e.dataTransfer.getData('text/plain');
        const src = findCard(cardId);
        if (!src) return;
        const targetColId = body.closest('.col').dataset.colId;
        const targetCol = STATE.cols.find(c => c.id === targetColId);
        if (!targetCol) return;
        // remove from source
        src.col.cards.splice(src.idx, 1);
        // add to target end
        src.card.done = (targetColId === 'done');
        targetCol.cards.push(src.card);
        render();
      });
    });
  }

  function wireInteractions() {
    // checkbox → move to done column
    document.querySelectorAll('[data-check]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const card = btn.closest('.card');
        const id = card.dataset.cardId;
        const src = findCard(id);
        if (!src) return;
        btn.classList.toggle('on');
        setTimeout(() => {
          src.col.cards.splice(src.idx, 1);
          src.card.done = true;
          STATE.cols.find(c => c.id === 'done').cards.push(src.card);
          render();
        }, 220);
      });
    });
    // + カード を 追加
    document.querySelectorAll('[data-add-col]').forEach(btn => {
      btn.addEventListener('click', () => {
        const colId = btn.dataset.addCol;
        const col = STATE.cols.find(c => c.id === colId);
        if (!col) return;
        const t = prompt('新しい カード の 内容 (@客 · 期限 · P1 の 形式 で 入力 可)');
        if (!t) return;
        col.cards.push({ id: 'n' + Date.now(), p: 'p2', who: '新規', title: t, due: '未 設定', labels: [] });
        render();
      });
    });
  }

  // quick add
  document.getElementById('qadd').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const raw = e.target.value.trim(); if (!raw) return;
    const parts = raw.split(/[·・]/).map(s => s.trim()).filter(Boolean);
    let who = '新規', title = raw, p = 'p3', colId = 'today';
    parts.forEach(x => {
      if (x.startsWith('@')) who = x.slice(1);
      else if (/^p[1-4]$/i.test(x)) p = x.toLowerCase();
      else if (/(今日)/i.test(x)) colId = 'today';
      else if (/(週|月|火|水|木|金|土|日)/i.test(x)) colId = 'week';
      else if (/(月)/i.test(x)) colId = 'month';
      else if (title === raw) title = x;
    });
    if (p === 'p1') colId = 'today';
    STATE.cols.find(c => c.id === colId).cards.push({
      id: 'n' + Date.now(), p, who, title, due: colId === 'today' ? '今日 中' : colId === 'week' ? '今週' : '今月', labels: [p]
    });
    e.target.value = '';
    render();
  });

  render();
</script>
</body>
</html>
