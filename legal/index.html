<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>法務文書 — FP Compass | Skeleton Inc.</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing:border-box; }
  body { margin:0; font-family:'Noto Sans JP',sans-serif; background:#0F172A; color:#fff;
    min-height:100vh; display:grid; place-items:center; padding:40px 20px;
    -webkit-font-smoothing:antialiased; }
  .wrap { max-width:680px; width:100%; }
  .brand { font-family:'Manrope',sans-serif; font-weight:800; font-size:13px;
    letter-spacing:0.24em; text-transform:uppercase; opacity:0.7; margin-bottom:12px; }
  h1 { font-family:'Manrope',sans-serif; font-weight:800; font-size:32px;
    letter-spacing:-0.02em; margin:0 0 12px; }
  .sub { font-size:14px; opacity:0.75; line-height:1.7; margin-bottom:36px; }
  .grid { display:grid; gap:14px; }
  .card {
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12);
    border-radius:12px; padding:24px 28px;
    text-decoration:none; color:inherit;
    display:grid; grid-template-columns:auto 1fr auto; gap:20px; align-items:center;
    transition:background .2s, transform .15s;
  }
  .card:hover { background:rgba(255,255,255,0.08); transform:translateX(4px); }
  .card-icon {
    width:48px; height:48px; border-radius:10px;
    background:linear-gradient(135deg,#5B5BF0,#3838CC);
    display:grid; place-items:center;
    font-family:'Manrope',sans-serif; font-weight:800; font-size:18px;
  }
  .card-title { font-family:'Manrope',sans-serif; font-weight:700; font-size:16px; }
  .card-desc { font-size:12.5px; opacity:0.7; margin-top:3px; }
  .card-arrow { font-size:18px; opacity:0.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Skeleton Inc. · 法務文書</div>
  <h1>FP Compass — Legal Documents</h1>
  <p class="sub">本サービスに関連する法務文書一式。 商談相手・代理店候補・FP・取締役会、 必要な相手に応じて使用。</p>

  <div class="grid">
    <a class="card" href="./privacy.html">
      <div class="card-icon">P</div>
      <div>
        <div class="card-title">プライバシーポリシー</div>
        <div class="card-desc">10条構成、 個人情報の取扱い・第三者提供・データ管理体制</div>
      </div>
      <div class="card-arrow">→</div>
    </a>
    <a class="card" href="./specified-commercial.html">
      <div class="card-icon">特</div>
      <div>
        <div class="card-title">特定商取引法に基づく表示</div>
        <div class="card-desc">事業者情報・販売価格・支払方法・解約条件</div>
      </div>
      <div class="card-arrow">→</div>
    </a>
    <a class="card" href="./contract.html">
      <div class="card-icon">契</div>
      <div>
        <div class="card-title">業務委託契約書 (代理店向け)</div>
        <div class="card-desc">11条構成、 報酬・税務・反社条項・1階層限定 (MLM 回避)</div>
      </div>
      <div class="card-arrow">→</div>
    </a>
  </div>
</div>
